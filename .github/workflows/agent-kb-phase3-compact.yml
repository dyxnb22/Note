name: Agent KB Phase 3 Compact Review
on:
  push:
    branches: [agent-kb-dedup-v1]
    paths:
      - 'Learning/Agent面试题库/_audit/phase3_compact_review.py'
      - '.github/workflows/agent-kb-phase3-compact.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-kb-dedup-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 'Learning/Agent面试题库/_audit/phase3_compact_review.py'
      - run: |
          git config user.name 'agent-kb-audit-bot'
          git config user.email 'agent-kb-audit-bot@users.noreply.github.com'
          git add 'Learning/Agent面试题库/_audit/PHASE3_COMPACT_REVIEW.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(agent-kb): render compact phase 3 review'
          git push origin HEAD:agent-kb-dedup-v1

name: Agent KB Phase 3 Map

on:
  push:
    branches: [agent-kb-dedup-v1]
    paths:
      - 'Learning/Agent面试题库/_audit/phase3_build.py'
      - 'Learning/Agent面试题库/_audit/phase3_maps/**'
      - 'Learning/Agent面试题库/_audit/atom_registry.json'
      - 'Learning/Agent面试题库/_audit/atom_migrations_phase2_gate.json'
      - '.github/workflows/agent-kb-phase3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-kb-dedup-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mapper dependency
        run: pip install --disable-pip-version-check 'sentence-transformers>=3,<6'
      - name: Build and validate Phase 3 map
        run: python3 'Learning/Agent面试题库/_audit/phase3_build.py'
      - name: Commit generated audit assets
        run: |
          git config user.name 'agent-kb-audit-bot'
          git config user.email 'agent-kb-audit-bot@users.noreply.github.com'
          git add 'Learning/Agent面试题库/_audit/question_atom_map.json' \
                  'Learning/Agent面试题库/_audit/phase3_review.json' \
                  'Learning/Agent面试题库/_audit/phase3_validation.json'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'audit(agent-kb): generate phase 3 question atom map'
            git push origin HEAD:agent-kb-dedup-v1
          fi

name: Agent KB Phase 4 Clustering
on:
  push:
    branches: [agent-kb-dedup-chatgpt-phase3]
    paths:
      - '.github/workflows/agent-kb-phase4.yml'
      - 'Learning/Agent面试题库/_audit/phase4_cluster.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-kb-dedup-chatgpt-phase3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build candidate clusters
        run: python3 'Learning/Agent面试题库/_audit/phase4_cluster.py'
      - name: Enforce Phase 4 structural gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Learning/Agent面试题库/_audit/phase4_validation.json')
          v=json.loads(p.read_text())
          assert v['status']=='passed'
          assert v['duplicate_edge_keys_unique'] is True
          print(v)
          PY
      - name: Commit Phase 4 audit assets
        run: |
          git config user.name 'agent-kb-audit-bot'
          git config user.email 'agent-kb-audit-bot@users.noreply.github.com'
          git add 'Learning/Agent面试题库/_audit/duplicate_clusters.json' \
                  'Learning/Agent面试题库/_audit/phase4_validation.json' \
                  'Learning/Agent面试题库/_audit/PHASE4_REPORT.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(agent-kb): generate phase 4 duplicate candidates'
          git push origin HEAD:agent-kb-dedup-chatgpt-phase3
